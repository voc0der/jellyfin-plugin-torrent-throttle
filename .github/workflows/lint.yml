name: Lint

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Check whitespace formatting
      run: |
        dotnet format whitespace --verify-no-changes --verbosity minimal
        dotnet format tests/Jellyfin.Plugin.TorrentThrottle.Tests/Jellyfin.Plugin.TorrentThrottle.Tests.csproj whitespace --verify-no-changes --verbosity minimal

    - name: Check C# style formatting
      run: |
        dotnet format style --verify-no-changes --severity warn --verbosity minimal
        dotnet format tests/Jellyfin.Plugin.TorrentThrottle.Tests/Jellyfin.Plugin.TorrentThrottle.Tests.csproj style --verify-no-changes --severity warn --verbosity minimal

    - name: Run tests with coverage
      run: >-
        dotnet test tests/Jellyfin.Plugin.TorrentThrottle.Tests/ --configuration Release --verbosity minimal
        --collect:"XPlat Code Coverage" --results-directory TestResults

    - name: Summarize coverage
      run: |
        python3 - <<'PY'
        import os
        import xml.etree.ElementTree as ET
        from pathlib import Path

        report, = Path("TestResults").glob("*/coverage.cobertura.xml")
        coverage = ET.parse(report).getroot()
        summary = "## .NET coverage\n\n"
        for label, metric in (("Lines", "lines"), ("Branches", "branches")):
            covered = int(coverage.attrib[f"{metric}-covered"])
            total = int(coverage.attrib[f"{metric}-valid"])
            summary += f"- {label}: {covered / total:.2%} ({covered}/{total})\n"
        print(summary)
        with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as output:
            output.write(summary)
        PY

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: coverage
        path: TestResults/**/coverage.cobertura.xml
        if-no-files-found: warn
